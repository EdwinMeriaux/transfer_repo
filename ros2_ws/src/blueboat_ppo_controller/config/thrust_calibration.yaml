blueboat_thrust_calibration:
  ros__parameters:
    mode: telemetry
    enable_powered: false
    deployment_target: sitl
    interface_file: ''
    # Measure total wet boat mass with payload. Zero allows telemetry ONLY.
    mass_kg: 0.0
    body_frame: base_link
    world_frame: map
    raw_imu_topic: /mavros/imu/data_raw
    attitude_topic: /mavros/imu/data
    velocity_topic: /mavros/local_position/odom
    # Alternatives: body_twist (/velocity_body), world_twist (/velocity_local).
    velocity_type: odometry
    require_output_feedback: true
    telemetry_timeout_s: 0.2
    max_skew_s: 0.05
    min_raw_rate_hz: 40.0
    min_attitude_rate_hz: 20.0
    min_velocity_rate_hz: 10.0
    min_output_rate_hz: 5.0
    baseline_s: 2.0
    pulse_s: 0.5
    recovery_s: 3.0
    # First test: one level per direction. Fits need >=2 levels, >=3 repeats.
    delta_pwm: [-40, 40]
    sides: [left, right, symmetric]
    repeats: 3
    max_delta_pwm: 60
    log_directory: ''
